id: corner-pmu-003
type: corner-lesson
module: pmu
name: External en_pmu_act must be driven explicitly; a 1 MOhm load is not an enable
  stimulus
tags:
- pmu
- enable
- root-anchor
- reachability
- bandgap
- ldo
- testbench
- dcop
process_nodes:
- 90nm
content:
  description: 'Source connectivity proves en_pmu_act is an external PMU-active input
    on root net19 / PMU port 13. A 1 MOhm observation load does not define an enable
    state; it weakly defaults the input near 0 V and can make the active branch appear
    to be a sizing or startup failure.

    '
  measured_impact: 'At LF6 TT/27 C, explicit en_pmu_act=0 V gives vref1p2=0.312955
    V, LDO15=18.197 uV, and LDO30=0.1753 uV. Explicit en_pmu_act=5 V gives vref1p2=1.218328
    V, LDO15=1.516302 V, and LDO30=3.059113 V; en_v rises to 4.993560 V and enb_p
    falls to approximately 0 V.

    '
  interpretation: 'The historical two-point enable axis is conditional reachability
    evidence for its stated fixtures. Its numerical values were not recomputed in
    this revision. It does not classify every earlier collapsed run: the selected
    cleanup active_dc already drives en_pmu_act=5 V. Both earlier axis cases retain
    their reported numerical caveats; the later bring-up log also contains gmin/bad-pivot
    notices, whose disposition is not revalidated here.'
  next_test: 'Repeat the explicit 0/5 V axis after numerical cleanup, then run one
    source-preserved VDD/PVDD ramp with the active vector before sizing or L2.

    '
