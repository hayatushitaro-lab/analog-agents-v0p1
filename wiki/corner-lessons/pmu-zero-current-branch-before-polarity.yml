id: corner-pmu-002
type: corner-lesson
module: pmu
name: "Near-zero dual rails plus a mostly-off operating point require branch diagnosis before resizing"
tags: [pmu, bandgap, ldo, por, degenerate-branch, gmin, dcop, bring-up]
process_nodes: [90nm]

content:
  description: >
    When a PMU DC point has vref1p2 far below its nominal band, both LDO rails
    near zero, and most MOS devices off, the first question is reachability of
    the intended branch. Device sizing or performance analysis is premature.
  measured_impact: >
    At TT/27 C the FM524 PMU measured vref1p2=0.312955 V, LDO15=18.20 uV,
    LDO30=0.175 uV, with 678 of 841 MOS records off, 148 linear, 9 saturated,
    and 6 subthreshold. All 19 fresh solves completed but carried gmin/bad-pivot
    warnings. No tested nominal vector produced both regulated rails.
  hypotheses: >
    The evidence is consistent with an unfulfilled startup or POR precondition,
    wrong control polarity, an externally required bias not yet identified, or
    a physically reachable zero-current branch. It does not distinguish these
    causes by itself.
  next_test: >
    Add a controlled VDD/PVDD ramp and capture branch entry; isolate Bandgap,
    vdd_por, and dvdd_por with finite loads; then repeat the polarity matrix.
    Only after a healthy vref and pass-device region appear should L2 load and
    transient metrics be enabled.

