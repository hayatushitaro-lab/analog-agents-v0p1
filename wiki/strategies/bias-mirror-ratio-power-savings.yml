id: strat-ota-004
type: strategy
name: 单级 OTA 内部自偏置用大镜像比(10:1)压 bias 支路功耗
tags:
- ota
- 5t
- bias
- mirror
- power
- self-bias
- sizing
process_nodes:
- 65nm
content:
  description: 在尾源/参考管匹配、均满足工作区及偏置精度要求时，增大I_tail/I_ref的名义镜像比可降低参考支路功耗。即便保持核心几何，有限输出电阻、偏置漂移和寄生仍可能改变性能，不能保证性能完全不动。r2最终版本同时改变输入对W1，不能作为只改bias的受控对比。
  how:
  - 理想比N=(W/L)_M5/(W/L)_Mbp=I_tail/I_ref；参考IREF从vbias抽向VSS，Mbp由VDD补流。
  - 本次原DUT为M5=Mbp=40u/2u、IREF=100u，名义1:1；r2摘要为M5=40u/2u、Mbp=4u/2u、IREF=10u，名义10:1。具体PDK宽度/finger/m语义须读准入模型，不从summary的nf反乘当前w。
  - 名义镜像误差不自动证明随机失配；确认mismatch需独立的失配模型/统计证据，有限VDS与输出电导也可产生误差。
  measured:
  - 历史来源保留于revisions。原DUT按理想1:1得总200uA/0.66mW；名义10:1在相同100uA尾电流假设下得110uA/0.363mW，这是条件算术，不是本次实测。旧210uA与0.66mW在3.3V下不自洽。
  - r2 final summary记W1=80u、尾电流约97u；其L3数值仅属于该历史版本，本次不核实、不移用，不能称与W1=52u原项目性能完全一致。
  when_to_use: 仅作参考支路功耗权衡线索；需另验证偏置准确度、工作区与性能。固定DUT recovery不据此调参。
  references:
  - corner-ota-002
  - anti-ota-001
