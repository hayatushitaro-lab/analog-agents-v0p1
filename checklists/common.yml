# ============================================================
# Common Pre-Simulation Checklist
# Applies to ALL analog circuits before running Spectre
# ============================================================
# severity: error (block simulation), warn (flag but proceed)
# method:
#   structural — parseable from netlist text (mirror ratios, connections, sizing)
#   estimate   — computable from netlist + process assumptions (Vth~0.3V, Vdsat~0.1V)
#   semantic   — needs design-intent reasoning (feedback polarity, compensation)

floating_nodes:
  description: "Every net must have at least one DC path to a supply or ground"
  method: structural
  severity: error
  effort: lite
  auto_checkable: true
  references: []
  how: >
    For each net in the subcircuit, check that it connects to at least
    2 device terminals. A net with only 1 connection is dangling.
    Exception: subcircuit ports (connected externally).

bulk_connections:
  description: "PMOS bulk → VDD (or source), NMOS bulk → VSS"
  method: structural
  severity: error
  effort: lite
  auto_checkable: true
  references: []
  how: >
    Parse each MOSFET instance. 4th terminal is bulk.
    PMOS (pch_*): must be VDD or the source net.
    NMOS (nch_*): must be VSS or 0 or the source net.
    Wrong bulk = wrong Vth, possible latchup.

mirror_ratio_vs_comment:
  description: "Actual W*nf ratio matches the intended current ratio in comments"
  method: structural
  severity: error
  effort: lite
  auto_checkable: true
  references: []
  how: >
    Identify mirror pairs: devices sharing the same gate net and same type.
    Compute ratio = (W*nf)_mirror / (W*nf)_ref.
    Compare against any current ratio stated in comments.
    Flag if mismatch > 5%.

supply_connections:
  description: "VDD and VSS actually connect to the top-level ports"
  method: structural
  severity: error
  effort: lite
  auto_checkable: true
  references: []
  how: >
    Verify subcircuit has VDD and VSS (or equivalent) in port list.
    Every device needing supply is connected to these nets, not to
    a similarly-named but disconnected internal net.

parameter_sanity:
  description: "No zero-width, zero-length, or negative device parameters"
  method: structural
  severity: error
  effort: lite
  auto_checkable: true
  references: []
  how: >
    For every MOSFET: W > 0, L > min_L (process dependent).
    For every R: r > 0. For every C: c >= 0.
    nf (number of fingers) must be positive integer.

bias_source_exists:
  description: "Every bias net has a DC path to a current or voltage source"
  method: structural
  severity: error
  effort: lite
  auto_checkable: true
  references: []
  how: >
    Trace each gate net of current-source MOSFETs back to either:
    (a) a diode-connected device with a current source, or
    (b) a voltage source.
    A floating gate = random bias = nothing works.

dc_path_to_output:
  description: "Output nodes have a DC path to both VDD and VSS"
  method: structural
  severity: error
  effort: lite
  auto_checkable: true
  references: []
  how: >
    From each output port, trace through devices (on-resistance)
    to VDD and to VSS. If either path is missing, the output
    will rail or float.

testbench_pin_match:
  description: "Testbench instantiation matches subcircuit port order"
  method: structural
  severity: error
  effort: lite
  auto_checkable: true
  references: []
  how: >
    Compare the subcircuit definition port list with the testbench
    instantiation. Positional mismatch = swapped signals.
    Named connections are safer but verify names match.

behavioral_ac_model_matches_tb:
  description: "Behavioral AC loop model must include the testbench's ESR zero and output-node parasitic cap before PM tables are used as design evidence"
  method: semantic
  severity: warn
  effort: standard
  auto_checkable: false
  references: [strat-ldo-019, anti-ldo-005]
  how: >
    Before quoting a PM/UGF table from a behavioral AC model, diff the model's
    element set against the real testbench: Cout ESR (zero), output-node parasitic
    C (n_out, 0.5-1.5pF typical), and Rz-Cc high-frequency decoupling. If the
    transient model already includes them but the AC model does not, that mismatch
    is itself a red flag. Re-derive the table with TB elements included, then
    gate on STB measurements (4 loads x 5 corners) rather than on the model.

# ============================================================
# PROPOSED by /analog-evolve 2026-09-09 (WORK_NB1910_BANDGAP_TUNE, proj-014).
# Pending maintainer approval — see WORK_NB1910_BANDGAP_TUNE/evolve-report.md.
# Placed in common.yml (not bandgap.yml) because the defect is generic to any
# netlist + multi-section model file. Remove this banner to promote.
# ============================================================

model_section_coverage:
  description: "Included model sections must define every device type instantiated in the DUT (per corner, including setup/corner-param dependencies) before the first remote simulation"
  method: structural
  severity: error
  effort: lite
  auto_checkable: true
  references: [anti-bandgap-005, corner-bandgap-010]
  how: >
    A device list is not a section list. Extract the set of primitive
    model/subckt names the DUT instantiates (all MOS wrappers, BJTs, resistors,
    caps — with instance counts), then statically resolve each name against the
    sections actually selected by the testbench includes for EVERY corner,
    including the corner-parameter and setup_* sections each model references
    (missing params fail at read-in even when the model itself resolves). A
    device defined only in a section nothing includes (e.g. inline `_mac`
    wrappers in `total_25od33`) is a silent FAIL. Run the probe with a negative
    control (the known-bad section set must FAIL) and record the log as an
    artifact next to the decks; gate L1 dispatch on an ALL-DECKS-PASS verdict.
    Cost is seconds, local; a failed remote read-in costs a full dispatch
    round-trip. This defect recurred (anti-bandgap-005) across two nb1910
    sessions and again on fm393 even though it was documented — the probe,
    not the documentation, is what prevents it.

# ============================================================
# PROPOSED by /analog-evolve 2026-09-09 (WORK_NB1601_BANDGAP_TUNE_20260909).
# Pending maintainer approval — see WORK_NB1601_BANDGAP_TUNE_20260909/evolve/report.md.
# Placed in common.yml (not bandgap.yml) because a verification plan + testbench
# save list exists for every block type. Remove this banner to promote.
# ============================================================

tb_save_list_covers_l1_checks:
  description: "Testbench save list must cover every signal required by the L1 checks in verification-plan.md before the first simulation batch"
  method: structural
  severity: warn
  effort: lite
  auto_checkable: true
  references: []
  how: >
    For each L1 check the verification plan promises (loop-balance node pairs,
    monitor pins, supply current, output node), extract the signal names the
    check needs and confirm each appears in the testbench save statements
    (save / saveOptions), including hierarchical paths (e.g. XBG.net055).
    A planned check whose signals are not saved silently degrades to
    "indirect evidence" and the batch that selects the operating point runs
    without it: in WORK_NB1601_BANDGAP_TUNE_20260909 the amp-balance gate
    |V(net055)-V(net090)| <= 1 mV was planned as the SS loop-health check,
    but the iteration-1 template saved only vref/Vvdd:p, so all 33 batch
    jobs carried no balance measurement; the number first appeared at L3
    after the architect updated the template. Cross-check before the FIRST
    batch dispatch, not after extraction.

# ============================================================
# PROPOSED by /analog-evolve 2026-09-09 (WORK_FM436_BANDGAP_TUNE_20260909).
# Pending maintainer approval — see WORK_FM436_BANDGAP_TUNE_20260909/evolve/report.md.
# Placed in common.yml (not bandgap.yml) because the defect is generic to any
# block verified against a multi-section PDK model include. Remove this banner
# to promote.
# ============================================================

corner_passives_actually_move:
  description: "Diff what the top-level corner sections actually select across tt/ss/ff: identical passive/BJT corner factors means corners act only through MOSFETs, and tt/ss/ff runs do NOT cover production R/C/BJT spread"
  method: structural
  severity: warn
  effort: lite
  auto_checkable: true
  references: [corner-bandgap-014, corner-bandgap-002]
  how: >
    While building the corner decks (the L0 model-coverage probe already
    resolves the include chain per corner), diff the corner-parameter
    selections across tt/ss/ff: passive/BJT corner multipliers (e.g. *_mfc
    factors, rtyp/ctyp/btyp sections). If they are identical, state in the
    margin table that the measured corner spread reflects MOSFET variation
    only, and plan separate coverage (trim/mismatch/production corners) for
    passives instead of claiming it from tt/ss/ff. Measured evidence
    (WORK_FM436_BANDGAP_TUNE_20260909, FM436 bandgap on Samsung LF6): rgdps
    and sp11 stayed typical at every corner, per-candidate vref27 corner
    spread was <=1 mV, and the measured worst POWER corner (ff_m40c) was NOT
    the hand-predicted ss_125c - corner ordering followed MOS+temp physics,
    not R spread. Assuming passives move would have mis-read both the corner
    risk and the power worst case.
