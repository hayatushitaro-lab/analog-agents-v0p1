content:
  description: Selected source records establish different ibn_lp stimuli, not a universal
    failure mechanism. The extant local DUT has MP10 (vbn enb1 ibn_lp VDD), MN8 (vbn
    vbn VSS VSS), and MN5 (vbn enb1 VSS VSS). Their text connections alone do not
    establish model terminal semantics, conducting states, a unique DC path, or a
    whole-chain collapse caused by a floating pin. See revisions/evidence_refs for
    exact source spans.
  measured_impact: '2026-09-22 scoped correction: the archived cleanup active_dc fixture
    (20260918_003610) drives ibn_lp/net24 with V_IBNLP, dc=5 V; it is not floating.
    The later 20260918_013118 results/02_tb_pmu_dc fixture uses IIBNLP (0 ibn_lp),
    dc=0.8u. Other fixture conditions including trim and loads also differ. Earlier
    session-wide numerical observations remain historical; these two records alone
    do not prove a sole cause or classify every previous run. See revisions/evidence_refs
    and proj-pmu-20260918 narrative for exact sources. Independent review remains
    pending. Revision 2: the historical 1.424 V at ibn_lp must not be equated with
    MN8 VGS; ibn_lp and vbn are distinct nodes separated by MP10. Historical numbers
    have not been remeasured. The later runtime DUT bytes are not authenticated by
    an include hash.'
  fix: Before inheriting a fixture, trace the formal/actual port mapping and record
    stimulus kind, polarity, magnitude and operating conditions from the selected
    deck. The later deck contains IIBNLP (0 ibn_lp) isource dc=0.8u; this is an observed
    fixture setting, not a validated nominal requirement. The earlier 0.6 uA nominal
    and 0.5x/1x/2x tuning advice are withdrawn as current recommendations for this
    question; they remain in revisions. Keep the DUT fixed and propose additional
    evidence only for a separately defined unresolved question.
