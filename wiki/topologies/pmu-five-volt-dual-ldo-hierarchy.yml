content:
  topology: In the inspected local PMU_top.scs, I30 vdd_por generates rstn_vdd_por;
    U0/I35 and U3/I44 form en_pmu = rstn_vdd_por AND en_pmu_act. I31 Bandgap and I13
    LDO15 follow this enable. I32 LDO30 has a separate sleep-qualified enable and
    mode selector. I24 dvdd_por consumes LDO30/AVDD, LDO15/DVDD, bandgap bias and
    en_pmu, then provides isolation/POR/en_v/enb_p outputs. These outputs and bg_flag
    do not feed the three block-enable inputs in this PMU definition.
  dependency_map: 'Conditional settled logic: E=R AND A; enb_pmu=NOT E; enb1_pmu=NOT(E
    OR sleep); mode_ldo30=sleep AND NOT E. E=1 selects Bandgap/LDO15 and normal LDO30
    even if sleep=1. E=0,sleep=1 disables Bandgap/LDO15 but selects enabled LDO30
    LP. E=0,sleep=0 disables all three. Logic supply must be valid; these are not
    startup threshold or performance guarantees.'
  design_note: Current inspected local library copy has 24 subckt definitions, 38
    PMU ports and no active top-level I2; selected historical decks instantiate XPMU.
    The earlier original-export I2 statement belongs to a different source/wrapper
    context. Local source SHA and exact spans are in the current recovery evidence;
    original user path and runtime include-byte identity are not authenticated.
  mode_details: LDO15 discharge is permitted only with EN=0 and enb_discg15=0 (I8/R13/MN17).
    LDO30 discharge is permitted only with local en=0 and enb_discg30=0 (I8/R0/MN82),
    so LP does not enable this discharge path. LDO30 mode selects external vref1p2
    through MP2/MN2 in normal mode versus internal vref1 through MP70/MN116 in LP.
    It also changes bias/output-stage control (MP37/MP40, MN31/MN34); ibn_lp bias
    conditions remain separately required evidence, not a validated nominal recipe.
  historical_lp_limit: 'The selected 06_exp_lp_mode historical export reports LDO30
    about 4.996 V at 2 ms under its 5 V/27 C, 0.8 uA injected bias, 1 uF output capacitors
    and 1 mA/100 uA loads. Retain as diagnostic history only; initial gmin notice
    and runtime identity remain unresolved. Withdraw the archived explanation that
    loss of bandgap reference by itself proves an unspecified pass device fully on:
    LP switches to vref1, and the exported MP47 current is near zero. Actual internal
    reference and output-path cause remain UNKNOWN.'
