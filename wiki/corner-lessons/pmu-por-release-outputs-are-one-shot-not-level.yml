id: corner-pmu-007
type: corner-lesson
module: pmu
name: POR release outputs may be one-shot pulses, not levels; only a ramped transient
  can tell, and the DC end point lies by omission
tags:
- pmu
- fm524
- POR
- dvdd_por
- one-shot
- sequencing
- bring-up
- dcop-vs-tran
process_nodes:
- 90nm
content:
  description: Separate the upstream VDD POR level rstn_vdd_por from the downstream
    dvdd_por sequencer. The historical active-startup ramp reported about 24 us transients
    on selected internal/isolation nodes; that does not make all POR outputs universal
    fixed-width one-shots. Under the selected LP-entry history, rstn_vdd_por remains
    high while dvdd_iso_5v/enb_p assert high and en_v becomes low. en_v is the inverter
    of isolation; enb_p is its level-shifted counterpart. Output shape must be stated
    per signal, mode, supply and observation window.
  measured_impact: 'fm524 PMU top, TT/27C ramp (pmu-ver-002): rstn_vdd_por snaps high
    at VDD ~= 2.5 V and HOLDS; en_pmu/rails follow; dvdd_iso_5v/net019/net018 rise
    ~100 us and fall at 123.7 us (~24 us pulse); bg_flag rises at 123.3 us; the same
    pulse-vs-level split reproduces in the DC decks (dvdd_por outputs at their post-pulse
    values). This run''s only failed L1 check (por_sequence) failed because the acceptance
    clause demanded "dvdd_por outputs hold intended levels" - the check encoded the
    wrong behavioral model, not a circuit fault (disposition in wiki/projects/fm524/iteration-log.yml,
    pmu-ver-002 entry).

    '
  fix: Use the current mode table and actual source connections before interpreting
    pulse versus level. Retain historical timing and L1 disposition as historical
    records, not new acceptance specifications. Do not derive a product pulse-width
    requirement from a measured example. The current question needs no new simulation;
    internal LP behavior and independent validation remain open.
