id: strat-pmu-002
type: strategy
module: pmu
name: 'PMU bring-up: trace ports and document fixture conditions; historical recipe
  is not a proven cause'
tags:
- pmu
- fm524
- bring-up
- testbench
- recipe
- enable-chain
- por
- reverse-engineering
process_nodes:
- 90nm
content:
  description: Trace each formal and actual port to its internal landing nodes before
    assigning a role. Record enable/control conditions from the implementation and
    selected fixture, together with source kind, direction, magnitude, loads and numerical
    options. Review those conditions before any separately authorized experiment.
    A connection pattern alone does not establish a current-input requirement, an
    enabled-state unique path, nominal bias sizing or a universally valid operating-point
    method. Consult the current corner-pmu-003/005 revisions and Q-ibn-lp-history
    rather than treating the old six-step recipe as proven.
  measured_impact: Historical reports describe a stalled earlier effort and a later
    accepted L1 6/7 result, including reported first-try DC and ramp endpoint comparisons;
    this revision does not remeasure or re-sign those results. The selected cleanup
    fixture already drives en_pmu_act and ibn_lp with 5 V sources, while later 02_tb_pmu_dc
    uses IIBNLP (0 ibn_lp) isource dc=0.8u and also changes trim, loads and other
    conditions. This is not a single-variable experiment or proof that the recipe
    caused the improvement. The later report records local before/after DUT hashes
    and an attempt-1 baseline; complete equivalence to the earlier cleanup and runtime
    include/model identity remain unverified.
  fix: For continued reading, inherit the port/condition-checking method and run-specific
    source records. Treat the later 0.8u setting as a historical fixture value, not
    a validated nominal requirement. Do not reuse the old mirror-unit current-sizing
    rule, 0.5x/1x/2x retry prescription, unique-path assumption or ibn_lp-to-MN8-VGS
    equivalence as current instructions. The archived stimulus-table.md direction
    erratum does not repair all its residual wording; archived deck comments have
    the same scope restriction. Preserve those archives and use current revisions
    when interpreting them. Keep the DUT fixed; the present source-history question
    needs no new simulation, tuning or repeated audit.
  mode_control_scope: 'Q-pmu-mode-control (2026-09-22) adds a fixed-local-copy interpretation:
    E=rstn_vdd_por AND en_pmu_act, enb1_pmu=NOT(E OR sleep), mode_ldo30=sleep AND
    NOT E. sleep alone does not request LP while E=1. LP selects LDO30 internal vref1
    via MP70/MN116, disconnecting the normal vref1p2 transmission gate, and changes
    bias/output-stage control. Keep historical near-VDD observation separate from
    the unproven bandgap-loss -> pass-fully-on explanation. For logic shutdown require
    E=0 and sleep=0; discharge additionally depends on enb_discg15/30. See topo-pmu-001
    and WORK_PMU_MODE_CONTROL_20260922/conclusions.md for source spans and unknowns;
    this does not restore withdrawn bias prescriptions.'
