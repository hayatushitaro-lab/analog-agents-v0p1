id: topo-ota-005
name: "Telescopic cascode OTA (PMOS input + NMOS cascode + NMOS mirror load)"
level: 3
topology: telescopic_cascode

supply:
  vdd: 3.3
  vcm: 1.2
  process: "TSMC-65nm 3.3V"
  devices: [nch_33, pch_33]

specs:
  Av:     { unit: dB,   default: 60 }
  GBW:    { unit: MHz,  default: 100 }
  PM:     { unit: deg,  default: 60 }
  CL:     { unit: pF,   default: 2 }
  Itail:  { unit: uA,   default: 100 }
  SR:     { unit: V/us, default: 50 }
  Vin_cm: { unit: V,    default: 1.2 }
  Vout_swing: { unit: V, default: 1.5 }

nodes:
  vin_p: vp
  vin_n: vn
  vout: vout
  vbias1: vb1        # 尾源栅
  vbias2: vb2        # cascode 栅
  vdd: VDD
  vss: VSS

devices:
  - { id: M1, role: input_p,        type: pch_33 }
  - { id: M2, role: input_n,        type: pch_33 }
  - { id: M3, role: cascode_n1,     type: nch_33 }
  - { id: M4, role: cascode_n2,     type: nch_33 }
  - { id: M5, role: load_mirror1,   type: nch_33 }
  - { id: M6, role: load_mirror2,   type: nch_33 }
  - { id: M7, role: tail,           type: pch_33 }

equations:
  gm1: "2 * pi * GBW * CL"
  Id:  "Itail / 2"
  gm_over_Id: "gm1 / Id"
  Vov1: "vov_from_gmid(gm/Id)"
  W1: "W_from_gmid(Id, L1, gm/Id, muCox_p)"
  Av: "gm1 * (gm3*ro3*ro1 || gm4*ro4*ro2)  # cascode 输出阻抗,近似 gm1*gm_cas*ro_cas*ro_in"
  SR: "Itail / CL"

calibration:
  muCox_p: { value: 30e-6, unit: "A/V^2", backout: "从 W1 反推 gm1" }
  muCox_n: { value: 60e-6, unit: "A/V^2", backout: "从 cascode/负载镜反推" }
  lambda_n: { value: 0.1, unit: "1/V", backout: "从 Av 实测反推 ro" }
  lambda_p: { value: 0.1, unit: "1/V", backout: "..." }

sensitivities:
  - { param: "W1/W2", up: [GBW], down: [PM], note: "输入对 gm 决定 GBW" }
  - { param: "W3/W4", up: [Av], down: [Vout_swing], note: "cascode 宽↑ → 输出阻抗↑增益↑,但摆幅↓" }
  - { param: Itail, up: [GBW, SR], down: [Av], note: "电流↑ → gm↑ 但 ro↓ 增益略降" }
  - { param: L_cascode, up: [Av], down: [Vout_swing], note: "cascode L↑ → ro↑增益↑" }

sizing_rules:
  - "finger width 默认 1u,镜像比只通过 nf/multi 调"
  - "输入对 gm/Id 10~15;cascode/镜像/尾源 gm/Id ~10"
  - "cascode 用长 L(2-4x 最小)提升 ro → 增益"
  - "telescopic 输出摆幅小:每侧压 3 个 Vov(cascode+输入对+尾源)"

pitfalls:
  - "telescopic 是 5 层堆叠(VDD→尾源→输入对→cascode→镜像→VSS),输出摆幅 = VDD - 5×Vov,很小"
  - "cascode 栅偏置 VB2 必须让上下管都在饱和区(输入对漏极电压 = VB2 - Vgs_cas)"
  - "PMOS 输入 → Vcm 低(近 VSS)"
  - "7 管结构,镜像 M5/M6 与 cascode M3/M4 堆叠——检查每层 Vds > Vdsat"

checklist: checklists/telescopic_ota.yml
template: templates/telescopic_ota.scs
