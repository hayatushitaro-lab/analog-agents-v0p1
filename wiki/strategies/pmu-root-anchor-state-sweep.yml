content:
  description: For fixed PMU mode questions, first trace each formal/actual port and
    derive the gate equations from the selected source version. Separate VDD POR qualification,
    downstream DVDD sequencing, block enable, mode-selected reference/bias, and discharge
    control. Existing run values are historical conditions; no sweep or simulation
    is implied by reading this strategy.
  procedure: 'Use the current Q-pmu-mode-control local-copy matrix: E=R AND A; E=1
    selects normal operation for either sleep value; E=0,sleep=1 selects LDO30 LP
    while Bandgap/LDO15 are off; E=0,sleep=0 disables all three. Trace both LDO30
    reference transmission gates and output branches before explaining rail behavior.
    If a future experiment is separately authorized, establish source kind/compliance
    and actual load/supply conditions first; the archived ibn_lp voltage sweep is
    not a current nominal recommendation.'
  measured_impact: Historical first-session 19-run collapsed-branch observations reported
    LDO30 near VDD with sleep high and low vref trim responses. They are not remeasured
    here and do not prove a valid operating branch or LP root cause. Later 06_exp_lp_mode
    also reported a near-VDD rail under different conditions, but its simple bandgap-loss/full-on
    explanation is not established by the inspected reference-selector structure.
  guardrails: Keep DUT fixed. A digital enable is not proof of regulation; a rail
    near VDD does not identify the conducting output transistor. Distinguish local
    subckt facts from complete elaboration, derived historical measurements from new
    results, and logic shutdown from zero current. Preserve Q-ibn-lp-history restrictions;
    no repeated acceptance or forward tuning is authorized by this strategy.
